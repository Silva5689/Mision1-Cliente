<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mision 1</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Tres en raya</h1>

    <noscript>
        <p>Este juego necesita JavaScript para funcionar.</p>
    </noscript>

    <div id="inicio">

        <h2>Jugadores</h2>

        <label for="inputJugador1">Jugador X</label>
        <input
            id="inputJugador1"
            type="text"
            placeholder="Nombre jugador X"
            maxlength="20"
        >

        <label for="inputJugador2">Jugador O</label>
        <input
            id="inputJugador2"
            type="text"
            placeholder="Nombre jugador O"
            maxlength="20"
        >

        <label for="modoJuego">Modo de juego</label>
        <select id="modoJuego">
            <option value="jugadores">2 jugadores</option>
            <option value="ia">Jugar contra IA</option>
        </select>

        <p id="errorNombre" class="mensaje-error" aria-live="polite"></p>

        <button id="empezar" type="button">
            Empezar partida
        </button>

    </div>

    <div id="juego" class="oculto">

        <div id="jugadores">
            <p id="jugador1">Jugador X</p>
            <p id="jugador2">Jugador O</p>
        </div>

        <div id="marcador">
            <h3>Marcador</h3>

            <div id="puntuaciones">
                <p id="marcadorX">X: 0</p>
                <p id="marcadorO">O: 0</p>
                <p id="marcadorEmpates">Empates: 0</p>
            </div>
        </div>

        <p id="turno" aria-live="polite">Turno: X</p>

        <div
            id="tablero"
            role="group"
            aria-label="Tablero de tres en raya"
        ></div>

        <button id="reiniciar" type="button">
            Reiniciar partida
        </button>

    </div>

</body>

</html>
